<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meeting Room Booking</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="layout">
      <header class="header">
        <div class="header__inner">
          <h1 class="header__title">Meeting Room Booking</h1>
          <p class="header__subtitle">Бронювання переговорних кімнат</p>
        </div>
      </header>

      <main class="main">
        <div class="main__inner">
          <section class="hero">
            <h2 class="hero__title">Розклад переговорних</h2>
            <p class="hero__text">
              Дані завантажуються з backend API. Нижче — список кімнат і поточні бронювання.
            </p>

            <div class="info-card">
              <p class="info-card__label">Backend URL</p>
              <p class="info-card__value" id="backend-url">—</p>
            </div>
          </section>

          <section class="data-section" aria-labelledby="rooms-heading">
            <h2 id="rooms-heading">Rooms</h2>
            <p id="rooms-status" class="data-section__status">Loading rooms…</p>
            <ul id="rooms-list"></ul>
          </section>

          <section class="data-section" aria-labelledby="bookings-heading">
            <h2 id="bookings-heading">Bookings</h2>
            <p id="bookings-status" class="data-section__status">Loading bookings…</p>
            <ul id="bookings-list"></ul>
          </section>
        </div>
      </main>

      <footer class="footer">
        <div class="footer__inner">
          <p>Meeting Room Booking · UA-Skills event2</p>
        </div>
      </footer>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
