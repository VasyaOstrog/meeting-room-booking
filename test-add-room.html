<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Room Test</title>
  <style>
    body {
      font-family: system-ui;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    .step {
      padding: 15px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    .success { background: #d4edda; border-color: #c3e6cb; }
    .error { background: #f8d7da; border-color: #f5c6cb; }
    button {
      padding: 10px 20px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover { background: #0056b3; }
    pre {
      background: #f5f5f5;
      padding: 10px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>Add Room Feature Test</h1>

  <div id="status"></div>

  <button onclick="runTest()">Run Full Test</button>

  <script>
    const API_BASE_URL = 'http://localhost:3001/api';
    const statusDiv = document.getElementById('status');

    function addStep(message, isSuccess = true) {
      const div = document.createElement('div');
      div.className = `step ${isSuccess ? 'success' : 'error'}`;
      div.textContent = message;
      statusDiv.appendChild(div);
    }

    function addJSON(title, data) {
      const div = document.createElement('div');
      div.className = 'step';
      div.innerHTML = `<strong>${title}</strong><pre>${JSON.stringify(data, null, 2)}</pre>`;
      statusDiv.appendChild(div);
    }

    async function runTest() {
      statusDiv.innerHTML = '<h2>Running Test...</h2>';

      try {
        // Step 1: Login as admin
        addStep('Step 1: Logging in as admin...');
        const loginRes = await fetch(`${API_BASE_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: 'test@example.com',
            password: 'admin123'
          })
        });

        const loginData = await loginRes.json();

        if (!loginRes.ok) {
          throw new Error(`Login failed: ${loginData.message}`);
        }

        if (!loginData.user.isAdmin) {
          throw new Error('User is not admin!');
        }

        addStep('✓ Login successful! User is admin.');
        addJSON('Login Response', loginData);

        const token = loginData.token;

        // Step 2: Create a new room
        addStep('Step 2: Creating a new room...');
        const roomName = `Test Room ${Date.now()}`;

        const createRes = await fetch(`${API_BASE_URL}/rooms`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            name: roomName,
            floor: 3,
            capacity: 15
          })
        });

        const createData = await createRes.json();

        if (!createRes.ok) {
          throw new Error(`Create room failed: ${createData.message}`);
        }

        addStep('✓ Room created successfully!');
        addJSON('Created Room', createData);

        // Step 3: Verify room appears in list
        addStep('Step 3: Verifying room appears in list...');
        const listRes = await fetch(`${API_BASE_URL}/rooms`);
        const rooms = await listRes.json();

        const foundRoom = rooms.find(r => r.id === createData.id);

        if (!foundRoom) {
          throw new Error('Room not found in list!');
        }

        addStep(`✓ Room found in list! Total rooms: ${rooms.length}`);
        addJSON('All Rooms', rooms);

        // Final success
        addStep('🎉 ALL TESTS PASSED! Add Room feature works end-to-end!', true);

      } catch (error) {
        addStep(`❌ Test failed: ${error.message}`, false);
        console.error(error);
      }
    }
  </script>
</body>
</html>
